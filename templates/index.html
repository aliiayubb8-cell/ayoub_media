<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>تقديم طلب صيانة - Ayoub Unlocker & Media Group</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>body { font-family: 'Tajawal', sans-serif; }</style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 md:p-8">
  
  <div class="max-w-3xl mx-auto space-y-6">
    <!-- هيدر الصفحة وزر سجل الطلبات والخروج -->
    <div class="flex justify-between items-center bg-slate-900 border border-slate-800 p-4 rounded-2xl">
      <div>
        <h1 class="text-xl font-extrabold text-sky-400">Ayoub Unlocker</h1>
        <p class="text-xs text-slate-400">نظام تقديم طلبات الصيانة والخدمات</p>
      </div>
      <div class="flex items-center gap-2">
        <a href="/history" class="bg-slate-800 hover:bg-slate-700 text-sky-400 border border-slate-700 text-xs px-4 py-2.5 rounded-xl transition font-bold">
          📁 سجل طلباتي السابقة
        </a>
        <a href="/user_logout" class="bg-rose-500/10 text-rose-400 hover:bg-rose-500/20 text-xs px-3 py-2.5 rounded-xl transition">
          خروج
        </a>
      </div>
    </div>

    <!-- نموذج تقديم الطلب -->
    <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6 md:p-8 shadow-2xl space-y-6">
      <div class="text-center">
        <h2 class="text-2xl font-extrabold text-white">تقديم طلب جديد</h2>
        <p class="text-slate-400 text-xs mt-1">املأ تفاصيل جهازك ومشكلته بدقة ليتم متابعته من قِبل الإدارة</p>
      </div>

      <form method="POST" enctype="multipart/form-data" class="space-y-4">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1.5">اسم الزبون *</label>
            <input type="text" name="name" required class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-white focus:outline-none focus:border-sky-500 transition" placeholder="الاسم الكامل">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1.5">رقم الهاتف *</label>
            <input type="text" name="phone" required class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-white focus:outline-none focus:border-sky-500 transition" placeholder="70123456">
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1.5">نوع الجهاز *</label>
            <input type="text" name="device" required class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-white focus:outline-none focus:border-sky-500 transition" placeholder="مثال: iPhone 13 Pro Max">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1.5">رقم الـ IMEI أو السيريال (اختياري)</label>
            <input type="text" name="imei" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-white focus:outline-none focus:border-sky-500 transition" placeholder="رقم الـ IMEI">
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1.5">شرح المشكلة بالتفصيل *</label>
          <textarea name="problem" rows="3" required class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-white focus:outline-none focus:border-sky-500 transition" placeholder="اكتب تفاصيل المشكلة هنا..."></textarea>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1.5">صورة الجهاز أو الشاشة (اختياري)</label>
          <input type="file" name="image" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-xs text-slate-300 file:bg-sky-500 file:text-white file:border-0 file:rounded-lg file:px-3 file:py-1.5 file:cursor-pointer">
        </div>

        <button type="submit" class="w-full bg-sky-500 hover:bg-sky-400 text-white font-bold py-3.5 rounded-xl shadow-lg transition">
          إرسال الطلب الآن 🚀
        </button>
      </form>
    </div>
  </div>

</body>
</html>
