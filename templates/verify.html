<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>تأكيد الرمز - Ayoub Unlocker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>body { font-family: 'Tajawal', sans-serif; }</style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">
  <div class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-3xl p-6 md:p-8 shadow-2xl space-y-6 text-center">
    <h1 class="text-2xl font-extrabold text-white">إدخال كود التحقق</h1>
    <p class="text-slate-400 text-xs">تم إرسال رمز مكون من 6 أرقام إلى بريدك الإلكتروني</p>

    {% if error %}
    <div class="bg-rose-500/10 border border-rose-500/30 text-rose-400 text-xs p-3 rounded-xl text-center">{{ error }}</div>
    {% endif %}

    <form method="POST" class="space-y-4">
      <input type="text" name="otp" maxlength="6" required class="w-full text-center tracking-widest text-2xl font-mono bg-slate-800 border border-slate-700 rounded-xl p-3 text-white focus:outline-none focus:border-sky-500" placeholder="000000">
      <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3.5 rounded-xl shadow-lg transition">
        تأكيد الحساب والدخول 🟢
      </button>
    </form>
  </div>
</body>
</html>
