<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>سجل طلباتي - Ayoub Unlocker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>body { font-family: 'Tajawal', sans-serif; }</style>
</head>
<body class="bg-slate-950 text-slate-100 p-4 md:p-8">
  <div class="max-w-3xl mx-auto space-y-6">
    <div class="flex justify-between items-center border-b border-slate-800 pb-4">
      <div>
        <h1 class="text-2xl font-bold text-sky-400">سجل طلباتي السابقة</h1>
        <p class="text-slate-400 text-xs mt-1">يمكنك متابعة حالة كل طلب وقيمته هنا</p>
      </div>
      <div class="flex items-center gap-2">
        <a href="/" class="bg-sky-600 hover:bg-sky-500 text-white text-xs px-4 py-2.5 rounded-xl transition font-bold">+ طلب جديد</a>
        <a href="/user_logout" class="bg-slate-800 text-slate-400 text-xs px-3 py-2.5 rounded-xl">خروج</a>
      </div>
    </div>

    <div class="space-y-4">
      {% for order in orders %}
      <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl flex justify-between items-center">
        <div>
          <span class="text-xs text-sky-400 font-mono font-bold">#{{ order[0] }}</span>
          <h3 class="font-bold text-white text-base mt-1">{{ order[3] }}</h3>
          <p class="text-xs text-slate-400 mt-1">حالة الطلب: <span class="text-amber-400 font-bold">{{ order[8] }}</span></p>
          {% if order[9] %}
          <p class="text-xs text-emerald-400 mt-1 font-bold">التكلفة: {{ order[9] }}</p>
          {% endif %}
        </div>
        <a href="/track/{{ order[0] }}" class="bg-slate-800 hover:bg-slate-700 text-sky-400 border border-slate-700 text-xs px-4 py-2 rounded-xl transition">
          عرض التفاصيل 👁️
        </a>
      </div>
      {% else %}
      <div class="bg-slate-900 border border-slate-800 p-12 text-center text-slate-500 rounded-2xl">
        لا توجد طلبات مسجلة بحسابك حتى الآن.
      </div>
      {% endfor %}
    </div>
  </div>
</body>
</html>
